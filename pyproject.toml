[project]
name = "rl-rewardhacking"
version = "0.1.0"
description = "Steering RL with training interventions on top of verl"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.30.0",
    "ipywidgets>=8.1.7",
    "litellm[proxy]>=1.74.8,<1.82",
    "nbformat>=4.2.0",
    "pandas>=2.3.1",
    "plotly",
    "polars>=1.31.0",
    "pydantic>=2.0.0",
    "orjson>=3.11.1",
    "jupyterlab>=4.4.5",
    "colorama>=0.4.6",
    "wandb>=0.22.3",
    "jinja2>=3.1.6",
    "torch",
    "transformers",
    "dill>=0.3.8",
    "typing-extensions>=4.14.1",
    "optuna>=4.4.0",
    "jupyter>=1.1.1",
    "notebook>=7.4.5",
    "scikit-learn>=1.7.1",
    "matplotlib>=3.10.5",
    "lightgbm>=4.6.0",
    "nnsight>=0.5.7",
    "hf-transfer>=0.1.9",
    "dotenv>=0.9.9",
    "fire>=0.7.1",
    "rollouts>=0.1.5",
    "backoff>=2.2.1",
    "seaborn>=0.13.2",
    "kaleido>=1.1.0",
    "datasets>=5.0.0",
    "pathos>=0.3.2",
    "omegaconf>=2.3.0",
    "anthropic>=0.75.0",
    "pymc>=5.25.1",
    "arviz>=0.23.0",
    "dataframe-image>=0.2.7",
    "nltk>=3.9.2",
    "emoji>=2.15.0",
    "syllapy>=0.7.2",
    "langdetect>=1.0.9",
    "immutabledict>=4.2.2",
    "debugpy>=1.8.17",
    "vastai>=0.2.8",
]

[project.entry-points."vllm.general_plugins"]
steering = "src.vllm_utils:steering_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
default-groups = []
conflicts = [
    [
        { group = "dev" },
        { group = "bench" },
        { group = "sglang" },
    ],
]


[dependency-groups]
dev = [
    "torch==2.11.0",
    "transformer-lens>=1.0.0",
    "sae-lens>=6.20.1",
    "triton>=3.3.1",
    "vllm[flashinfer]==0.24.0", # Pinned: this is the version the Gemma 4 rollout is verified against
    "accelerate>=1.11.0",
    "codetiming>=1.4.0",
    "datasets>=5.0.0",
    "dill>=0.3.8",
    "fastapi>=0.115.14",
    "hydra-core>=1.3.2",
    "latex2sympy2-extended>=1.10.2",
    "liger-kernel>=0.6.3",
    "math-verify>=0.8.0",
    "numpy>=2.0.0",
    "packaging>=20.0",
    "pandas>=2.3.3",
    "peft>=0.20.0", # transformers 5 removed HybridCache, which peft < 0.20 imports
    "pre-commit>=4.4.0",
    "pyarrow>=19.0.0",
    "pybind11>=3.0.1",
    "pylatexenc>=2.10",
    "ray[default]>=2.51.0",
    "tensorboard>=2.20.0",
    "tensordict==0.10.0", # Pinned: the version the verl 0.9 engine is verified against
    "torchdata>=0.11.0",
    "transformers>=5.5.3,!=5.6.0,<5.11",
    "uvicorn>=0.29.0",
    "bitsandbytes>=0.48.1",
    "nvidia-ml-py>=13.580.82",
]
eval = [
    "bert-score>=0.3.13",
]
data = [
    "gdown>=5.2.0",
    "datasketch>=1.6.0",
]
gemini = [
    "google-genai>=1.0.0",
]
bench = [
    "torch>=2.9.0",
    "vllm>=0.15.0",
    "fire>=0.7.1",
    "nltk>=3.9.2",
    "openai>=1.0.0",
]
sglang = [
    "torch>=2.8.0",
    "sglang[srt]>=0.4.6",
    "fire>=0.7.1",
    "nltk>=3.9.2",
    "openai>=1.0.0",
]

# torch 2.11 (required by vLLM >= 0.24, which is what serves Gemma 4) is not published on the
# cu128 index - the CUDA wheels come straight from PyPI now, so no index override is needed.

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
