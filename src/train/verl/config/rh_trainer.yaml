hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  apply_chat_template_kwargs: {}

algorithm:
  adv_estimator: grpo_modified

  norm_adv_by_std_in_grpo: true
  fill_nan_global: false

  # Screening specs
  screening_specs: {} # WARNING: Dict fields are merged

  # Fields to pass to screening functions
  extra_infos: [] # WARNING: List fields are merged

  # Probe-based loss term
  probe_loss:
    enabled: false
    probe_path: null
    layers: null
    coeff: 1.0
    aggregation: mean
    retrain_freq: 0
    retrain_dataset_path: null

# Repo-owned reward configuration. verl's own reward loop is configured under `reward:` (see
# grpo_config.jinja2); this block is read only by RHGRPORayTrainer, which computes the reward
# for the whole batch on the driver.
reward_model:
  reward_manager: batch_activations

  reward_kwargs:
      reward_specs: {} # WARNING: Dict fields are merged

# Interpretability add-ons. These attached to the pre-0.7 SPMD vLLM rollout, which verl removed
# in favour of the async agent-loop server; RHGRPORayTrainer raises if any is enabled.
interp:
  activation_cache:
    mode: null                  # null=disabled; other modes are not available on verl >= 0.7
    layers: [18]                # Layer indices to capture (1-indexed HF convention)
    position: response_avg      # Aggregation position; "response_avg" or "response_all"
    probe_path: null
    batch_size: 16
    model: null
    num_workers: 1
    sync_lora: false
    debug_dump_token_ids: false
    compare_with_worker: false
  caft:
    enable: false
    orthogonalize: true # If true, will run QR decomposition
    path: null # Must be a matrix of shape (hidden_size, K) where K is the number of components
    layer: 18
  steering:
    enable: false
    path: null
    layer: 18
    alpha: 1.0
  oracle:
    enable: false
    adapter_path: null
    questions: []
    act_layer: 18
    injection_layer: 1
    steering_coefficient: 1.0
    batch_size: 8
    sync_lora: true
    generation_kwargs: {}

trainer:
  val_before_train: false
  max_actor_lora_to_keep: null
  use_v1: false
