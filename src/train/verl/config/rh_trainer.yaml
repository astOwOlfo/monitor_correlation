hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  apply_chat_template_kwargs: {}

actor_rollout_ref:
  rollout:
    engine_kwargs:
      vllm: {}
      interp_vllm:
        activation_cache:
          mode: null                  # null=disabled, "interp_vllm"=inline, "worker"=separate GPU, "actor_rollout"=training model
          layers: [18]                # Layer indices to capture (1-indexed HF convention)
          position: response_avg      # Aggregation position; "response_avg" or "response_all"
          probe_path: null            # Optional probe path; when set in actor_rollout/worker modes, cache probe probabilities instead of raw activations
          batch_size: 16              # Buffer size for inline capture; HF forward batch size for workers
          model: null                 # HF model ID for separate worker; null = same as training model
          num_workers: 1              # Number of separate ActivationsWorker(s); only used when mode="worker"
          sync_lora: false            # Sync LoRA params from training model
        caft:
          enable: false
          orthogonalize: true # If true, will run QR decomposition
          path: null # Must be a matrix of shape (hidden_size, K) where K is the number of components
          layer: 18
        steering:
          enable: false
          path: null
          layer: 18
          alpha: 1.0
        oracle:
          enable: false
          adapter_path: null
          questions: []
          act_layer: 18
          injection_layer: 1
          steering_coefficient: 1.0
          batch_size: 8
          sync_lora: true
          generation_kwargs: {}

algorithm:
  adv_estimator: grpo_modified

  norm_adv_by_std_in_grpo: true
  fill_nan_global: false

  # Screening specs
  screening_specs: {} # WARNING: Dict fields are merged

  # Fields to pass to screening functions
  extra_infos: [] # WARNING: List fields are merged

  # Probe-based loss term
  probe_loss:
    enabled: false
    probe_path: null
    layers: null
    coeff: 1.0
    aggregation: mean
    retrain_freq: 0
    retrain_dataset_path: null

reward_model:
  # Acts the same as batch if no activations are passed
  reward_manager: batch_activations

  # Custom reward function path is not used
  reward_kwargs:
      reward_specs: {} # WARNING: Dict fields are merged


trainer:
  val_before_train: false
  max_actor_lora_to_keep: null
